version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: resqroute_spatial_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-resqroute_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-RITESH@2004}
    ports:
      - "5432:5432"
    volumes:
      - postgres_spatial_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: resqroute_cache_broker
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-resqroute_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-RITESH@2004}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-resqroute_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-RITESH@2004}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web

volumes:
  postgres_spatial_data: